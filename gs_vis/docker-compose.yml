services:
  visionary-vnc:
    build:
      context: ./docker
    container_name: visionary-vnc
    gpus:
      - driver: nvidia
        device_ids:
          - "${GPU_DEVICE:-0}"
        capabilities: [gpu]
    shm_size: "8gb"
    environment:
      WORKSPACE: /workspace
      VISIONARY_DIR: /workspace/gs_vis/visionary
      MODEL_SRC: /workspace/da3/output_gs/gs_ply/0000.ply
      GPU_DEVICE: "${GPU_DEVICE:-0}"
      VISIONARY_PORT: 3000
      VNC_PORT: 5901
      NOVNC_PORT: 6080
      NVIDIA_VISIBLE_DEVICES: "${GPU_DEVICE:-0}"
      NVIDIA_DRIVER_CAPABILITIES: all
    ports:
      - "3000:3000"
      - "5901:5901"
      - "6080:6080"
    volumes:
      - ..:/workspace
    working_dir: /workspace
